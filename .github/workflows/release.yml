name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: publish github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          JARS=(build/libs/*.jar)
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *"-pre"* || "$TAG_NAME" == *"-alpha"* || "$TAG_NAME" == *"-beta"* || "$TAG_NAME" == *"-rc"* || "$TAG_NAME" == "v1.0.0" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG_NAME" "${JARS[@]}" \
            --title "PLAYER MARKET $TAG_NAME (Minecraft 26.3 Fabric Pre-Release)" \
            --notes-file .github/RELEASE_NOTES.md \
            $PRERELEASE_FLAG
